# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6fd2209d338b44cf48e4bba03958c485"
name = "mirror-sync"
application_url = "https://mirror-sync-production.up.railway.app"
embedded = true

[build]
# Development is over: dev runs must NOT re-point the app at a tunnel
# (a killed dev session leaves the URL on a dead tunnel and breaks the
# embedded app for every store). If you need embedded dev again, flip this
# to true for the session and re-run `shopify app deploy` afterwards —
# and note `shopify app dev clean --store=<store>` clears a stuck preview.
automatically_update_urls_on_dev = false
dev_store_url = "mirror-sync-dest.myshopify.com"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,write_inventory,read_products,write_products,read_locations"
optional_scopes = [ ]
use_legacy_install_flow = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/sync"
  topics = [
  "inventory_levels/update",
  "products/update",
  "products/delete"
]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [
  "https://mirror-sync-production.up.railway.app/auth/callback",
  "https://mirror-sync-production.up.railway.app/auth/shopify/callback",
]
