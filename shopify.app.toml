# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6fd2209d338b44cf48e4bba03958c485"
name = "mirror-sync"
application_url = "https://example.com"
embedded = true

[build]
# Let `shopify app dev` point the app at the tunnel/preview URL each run
# instead of the placeholder application_url above (which is why the
# embedded app was loading "Example Domain").
automatically_update_urls_on_dev = true
dev_store_url = "mirror-sync.myshopify.com"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,write_inventory,read_products,write_products,read_locations"
optional_scopes = [ ]
use_legacy_install_flow = false

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/sync"
  topics = [
  "inventory_levels/update",
  "products/update",
  "products/delete"
]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ ]
