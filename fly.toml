# Fly.io config for MirrorSync.
# Architecture requires EXACTLY ONE always-on machine (single-threaded
# worker owns watermarks + rate budgets) — deploy with `fly deploy
# --ha=false` and never enable autoscaling.
app = "mirror-sync"
primary_region = "bom" # Mumbai — same region as the Supabase project (ap-south-1)

# Give the graceful drain (25s worker budget in server.mjs) room before
# SIGKILL on deploys.
kill_timeout = "30s"

[env]
  PORT = "3000"
  RUN_WORKER = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # Never sleep: webhooks and the queue consumer need an always-on process.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
